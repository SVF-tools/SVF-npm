name: svf-publish

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: "https://registry.npmjs.org/"

      - name: Update npm
        run: npm install -g npm@11

      - name: publish-svf-lib
        run: |
          node --version
          npm --version
          cat package.json
          if publish_output=$(npm publish --access public 2>&1); then
            printf '%s\n' "$publish_output"
          elif grep -Fq 'Cannot publish over previously staged version' <<< "$publish_output"; then
            printf '%s\n' "$publish_output"
            echo "Package version is already staged on npm; continuing with verification."
          else
            printf '%s\n' "$publish_output"
            exit 1
          fi

      - name: Verify package contents
        run: |
          TARBALL=$(npm pack --silent)

          echo "Listing package tarball contents..."
          tar -tzf "$TARBALL" | tee package-files.txt

          echo "Checking Linux x64 binary..."
          grep '^package/SVF-linux-x86_64/' package-files.txt

          echo "Checking Linux ARM/aarch64 binary..."
          grep '^package/SVF-linux-aarch64/' package-files.txt

          echo "Checking macOS binary..."
          grep '^package/SVF-osx/' package-files.txt
          
  trigger-svf-python:
    if: github.event_name == 'push'  # Only run on push events
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0            # need history to find each platform's last update
          filter: blob:none         # history only, no binaries
          sparse-checkout: .github

      # SVF pushes each platform separately, so trigger SVF-Python only once
      # all wheel platforms have been updated since the last trigger.
      - name: Check every wheel platform was updated since the last trigger
        id: changes
        run: |
          git clone -q --filter=blob:none --no-checkout https://github.com/SVF-tools/SVF-Python.git ../SVF-Python-log
          LAST=$(git -C ../SVF-Python-log log -1 --format=%ct --grep='^trigger: ' || true)
          LAST=${LAST:-0}
          echo "Last SVF-Python trigger: $LAST"
          SHOULD=true
          for p in SVF-linux-x86_64 SVF-linux-aarch64 SVF-osx; do
            T=$(git log -1 --format=%ct -- "$p")
            echo "$p last updated: ${T:-never}"
            if [ -z "$T" ] || [ "$T" -le "$LAST" ]; then SHOULD=false; fi
          done
          echo "should_trigger=$SHOULD" >> $GITHUB_OUTPUT

      - name: Trigger SVF-Python workflow if needed
        if: steps.changes.outputs.should_trigger == 'true'
        run: |
          git clone https://github.com/SVF-tools/SVF-Python.git
          cd SVF-Python
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "trigger: SVF-linux-x86_64, SVF-linux-aarch64 and SVF-osx updated"
          git push https://yuleisui:${{secrets.yulei_git_key}}@github.com/SVF-tools/SVF-Python.git HEAD:main
